name: Android APK

# Release signing is optional: it needs the four KEYSTORE_* secrets listed in the
# release steps below. Secret values are never printed; the JKS is decoded into
# $RUNNER_TEMP only.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SIGNING_ENABLED: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Select Gradle command
        run: |
          if [ -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Unit tests
        run: $GRADLE_CMD :app:testDebugUnitTest

      - name: Assemble debug APK
        run: $GRADLE_CMD :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spiazzetta-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode release keystore
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          KEYSTORE_PATH="$RUNNER_TEMP/spiazzetta-release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "Decoded keystore to $KEYSTORE_PATH"

      - name: Assemble release APK
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/spiazzetta-release.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: $GRADLE_CMD :app:assembleRelease

      - name: Upload release APK
        if: env.RELEASE_SIGNING_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: spiazzetta-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Check release APK presence
        id: release_apk
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if compgen -G "app/build/outputs/apk/release/*.apk" > /dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach release APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/v') && steps.release_apk.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
